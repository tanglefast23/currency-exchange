# Publishes the static site to GitHub Pages.
# The site is plain HTML/CSS/JS, so there is nothing to build — the repo is
# uploaded as-is. Every path in the app is relative, so it works from the
# /currency-exchange/ subpath Pages serves it from.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/currency-exchange-pwa-9rnr6j
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Turn Pages on and read its settings
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
